# ---------------------------------------------------------------------------
# Register the agent-media MCP server. This is the DEFAULT media server every
# agent gets (the entrypoint registers it for ALL agents, template or not, under
# the server name `media`). It is THIN — the CP-proxy tools only, no heavy render
# deps — so it is safe to install everywhere.
#
# Tools appear to the model as:
#   mcp__media__generate_ai_video, mcp__media__ai_video_status,
#   mcp__media__list_ai_video_models, mcp__media__speak, mcp__media__list_voices
#
# Every tool calls the Control-Plane as the OWNER (CP_SELF_URL/MARKET_URL +
# MARKET_TOKEN) and bills the owner tokens; the provider secret key stays in CP.
#
# Prereq: run  bash <skills>/agent-media/setup.sh  once (installs the MCP SDK).
# ---------------------------------------------------------------------------
mcp_servers:
  media:
    command: "node"                       # PATH-resolved; falls back to $HERMES_HOME/node/bin
    args: ["${userHome}/.hermes/skills/agent-media/mcp-server.mjs"]
    cwd: "${userHome}/.hermes/skills/agent-media"
    env:
      # The CP API base + the owner's personal token — bills the owner, keeps the
      # provider secret key server-side.
      CP_SELF_URL: "${CP_SELF_URL}"
      MARKET_URL: "${MARKET_URL}"
      MARKET_TOKEN: "${MARKET_TOKEN}"
    connect_timeout: 120

# Equivalent CLI (writes the same block):
#   hermes mcp add media node ${userHome}/.hermes/skills/agent-media/mcp-server.mjs \
#     --cwd ${userHome}/.hermes/skills/agent-media --connect-timeout 120 \
#     --env CP_SELF_URL=... --env MARKET_URL=... --env MARKET_TOKEN=...
#   # then: /reload-mcp
